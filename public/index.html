<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mensajería Service</title>
    <style>
      :root {
        --bg: #eef5ef;
        --card: #ffffff;
        --text: #17311d;
        --muted: #5d7264;
        --line: #d6e4d8;
        --green: #1e8a38;
        --green-light: #e6f4ea;
        --amber: #b45309;
        --amber-light: #fef3c7;
        --red: #b91c1c;
        --red-light: #fee2e2;
        --blue: #1d4ed8;
        --blue-light: #dbeafe;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: radial-gradient(circle at top, #dff3e4 0%, var(--bg) 52%);
        color: var(--text);
        min-height: 100vh;
        padding: 32px 16px;
      }

      .container {
        max-width: 720px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      header {
        display: flex;
        align-items: baseline;
        gap: 12px;
      }

      header h1 {
        font-size: 1.5rem;
        font-weight: 700;
      }

      header span {
        font-size: 0.8rem;
        color: var(--muted);
        background: var(--line);
        padding: 2px 8px;
        border-radius: 999px;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 20px 24px;
        box-shadow: 0 4px 16px rgba(21, 43, 27, 0.06);
      }

      .card h2 {
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 14px;
      }

      .channel + .channel {
        margin-top: 18px;
        padding-top: 18px;
        border-top: 1px solid var(--line);
      }

      .channel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 5px;
      }

      .channel-header h3 {
        font-size: 1rem;
        font-weight: 750;
      }

      .channel-link {
        color: var(--green);
        font-size: 0.78rem;
        font-weight: 700;
        text-decoration: none;
      }

      .channel-link:hover { text-decoration: underline; }

      .channel-list {
        padding-left: 12px;
        border-left: 3px solid var(--green-light);
      }

      /* Status rows */
      .status-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 0;
        border-bottom: 1px solid var(--line);
      }

      .status-row:last-child { border-bottom: none; }

      a.status-row {
        color: inherit;
        text-decoration: none;
      }

      a.status-row:hover .status-label {
        color: var(--green);
      }

      .status-label {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 600;
        font-size: 0.95rem;
      }

      .status-information {
        min-width: 0;
      }

      .status-name {
        font-weight: 650;
        overflow-wrap: anywhere;
      }

      .icon { font-size: 1.1rem; }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 3px 10px;
        border-radius: 999px;
        font-size: 0.8rem;
        font-weight: 600;
      }

      .badge::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: currentColor;
        opacity: 0.7;
      }

      .badge.green  { color: var(--green);  background: var(--green-light); }
      .badge.amber  { color: var(--amber);  background: var(--amber-light); }
      .badge.red    { color: var(--red);    background: var(--red-light);   }
      .badge.muted  { color: var(--muted);  background: var(--line);        }

      .status-detail {
        font-size: 0.78rem;
        color: var(--muted);
        margin-top: 2px;
      }

      .refresh-hint {
        text-align: right;
        font-size: 0.72rem;
        color: var(--muted);
        padding-right: 4px;
      }

      @media (max-width: 600px) {
        .card { padding: 18px; }
        .status-row { gap: 10px; }
      }
    </style>
  </head>
  <body>
    <div class="container">

      <header>
        <h1>mensajeria-service</h1>
        <span id="uptime">cargando...</span>
      </header>

      <!-- Estado por canal -->
      <div class="card">
        <h2>Canales</h2>

        <section class="channel">
          <div class="channel-header">
            <h3>WhatsApp</h3>
            <a class="channel-link" href="/whatsapp/panel">Administrar</a>
          </div>
          <div id="wa-status-list" class="channel-list">
            <div class="status-row">
              <div class="status-detail">Consultando instancias...</div>
            </div>
          </div>
        </section>

        <section class="channel">
          <div class="channel-header">
            <h3>Telegram</h3>
            <a class="channel-link" href="/telegram/panel">Administrar</a>
          </div>
          <div id="tg-status-list" class="channel-list">
            <div class="status-row">
              <div class="status-detail">Consultando bot...</div>
            </div>
          </div>
        </section>

        <section class="channel">
          <div class="channel-header">
            <h3>Gmail</h3>
            <a class="channel-link" href="/gmail/panel">Administrar</a>
          </div>
          <div id="gmail-status-list" class="channel-list">
            <div class="status-row">
              <div class="status-detail">Consultando cuentas...</div>
            </div>
          </div>
        </section>

        <section class="channel">
          <div class="channel-header">
            <h3>IA / Gemini</h3>
            <a class="channel-link" href="/ia/panel">Probar</a>
          </div>
          <div id="ia-status-list" class="channel-list">
            <div class="status-row">
              <div class="status-detail">Consultando Gemini...</div>
            </div>
          </div>
        </section>
      </div>

      <div class="refresh-hint" id="refresh-hint">actualizando estado...</div>
    </div>

    <script>
      const startTime = Date.now();

      function fmt(ms) {
        const s = Math.floor(ms / 1000);
        if (s < 60) return `${s}s`;
        const m = Math.floor(s / 60);
        if (m < 60) return `${m}m ${s % 60}s`;
        return `${Math.floor(m / 60)}h ${m % 60}m`;
      }

      function badgeClass(estado) {
        if (["conectado", "configurado"].includes(estado)) return "green";
        if ([
          "conectando",
          "inicializando",
          "generando_codigo",
          "esperando_vinculacion",
          "pendiente_vinculacion",
          "qr"
        ].includes(estado)) return "amber";
        if ([
          "desconectado",
          "error",
          "numero_incorrecto",
          "error_configuracion",
          "error_almacenamiento"
        ].includes(estado)) return "red";
        return "muted";
      }

      function badgeLabel(estado) {
        const map = {
          conectado: "conectado",
          conectando: "conectando...",
          desconectado: "desconectado",
          qr: "esperando QR",
          inicializando: "inicializando...",
          generando_codigo: "generando código...",
          esperando_vinculacion: "esperando vinculación",
          pendiente_vinculacion: "sin vincular",
          numero_incorrecto: "número incorrecto",
          error: "error",
          configurado: "configurado",
          no_configurado: "no configurado",
          error_configuracion: "error de config",
          error_almacenamiento: "error de datos"
        };
        return map[estado] || estado;
      }

      function createStatusRow({ href, name, detail, estado }) {
        const row = document.createElement(href ? "a" : "div");
        row.className = "status-row";
        if (href) row.href = href;

        const information = document.createElement("div");
        information.className = "status-information";
        const label = document.createElement("div");
        label.className = "status-name";
        label.textContent = name;
        const statusDetail = document.createElement("div");
        statusDetail.className = "status-detail";
        statusDetail.textContent = detail || "";
        information.append(label, statusDetail);

        const badge = document.createElement("span");
        badge.className = `badge ${badgeClass(estado)}`;
        badge.textContent = badgeLabel(estado);

        row.append(information, badge);
        return row;
      }

      function renderWhatsAppStatus(data) {
        const container = document.getElementById("wa-status-list");
        container.replaceChildren();

        if (data.modo !== "multi") {
          container.appendChild(
            createStatusRow({
              href: data.estado === "qr" ? "/whatsapp/login" : "/whatsapp/panel",
              name: "WhatsApp principal",
              detail:
                data.estado === "qr"
                  ? "Abrí esta cuenta para escanear el QR"
                  : "Instancia del modo clásico",
              estado: data.estado
            })
          );
          return;
        }

        const instances = Array.isArray(data.instancias) ? data.instancias : [];
        if (!instances.length) {
          container.appendChild(
            createStatusRow({
              href: "/whatsapp/panel",
              name: "Crear primera instancia",
              detail: "Todavía no hay números cargados",
              estado: "no_configurado"
            })
          );
          return;
        }

        for (const instance of instances) {
          container.appendChild(
            createStatusRow({
              href: `/whatsapp/panel?instancia=${encodeURIComponent(instance.id)}`,
              name: instance.nombre,
              detail: `+${instance.numero}`,
              estado: instance.estado
            })
          );
        }
      }

      function renderTelegramStatus(data) {
        const container = document.getElementById("tg-status-list");
        container.replaceChildren();
        container.appendChild(
          createStatusRow({
            name: data.bot ? `@${data.bot}` : "Bot de Telegram",
            detail: data.bot
              ? "Bot configurado para notificaciones"
              : (data.detalle || "Todavía no hay un bot configurado"),
            estado: data.estado
          })
        );
      }

      function renderGmailStatus(status, accountsData) {
        const container = document.getElementById("gmail-status-list");
        const accounts = Array.isArray(accountsData.cuentas)
          ? accountsData.cuentas
          : [];
        container.replaceChildren();

        if (!accounts.length) {
          container.appendChild(
            createStatusRow({
              href: "/gmail/panel",
              name: "Agregar cuenta",
              detail: status.configurado
                ? "Todavía no hay cuentas vinculadas"
                : "Completá la configuración de Gmail",
              estado: status.estado
            })
          );
          return;
        }

        for (const account of accounts) {
          container.appendChild(
            createStatusRow({
              href: "/gmail/panel",
              name: account.identificacion,
              detail: account.email,
              estado: status.configurado ? "configurado" : status.estado
            })
          );
        }
      }

      function renderIaStatus(data, responseOk) {
        const container = document.getElementById("ia-status-list");
        container.replaceChildren();

        if (!responseOk) {
          container.appendChild(
            createStatusRow({
              href: "/ia/panel",
              name: "Gemini",
              detail:
                data.error ||
                "No se pudo consultar el estado de la integracion",
              estado: "error"
            })
          );
          return;
        }

        container.appendChild(
          createStatusRow({
            href: "/ia/panel",
            name: "Gemini",
            detail: data.configurado
              ? `Modelo: ${data.modelo}`
              : "Falta configurar GEMINI_API_KEY",
            estado: data.configurado ? "configurado" : "no_configurado"
          })
        );
      }

      async function refreshStatus() {
        try {
          const [waRes, tgRes, gmailRes, gmailAccountsRes, iaRes] = await Promise.all([
            fetch("/whatsapp/estado"),
            fetch("/telegram/estado"),
            fetch("/gmail/estado"),
            fetch("/gmail/cuentas"),
            fetch("/ia/estado")
          ]);

          const wa = await waRes.json();
          const tg = await tgRes.json();
          const gmail = await gmailRes.json();
          const gmailAccounts = await gmailAccountsRes.json();
          const ia = await iaRes.json();

          renderWhatsAppStatus(wa);
          renderTelegramStatus(tg);
          renderGmailStatus(gmail, gmailAccounts);
          renderIaStatus(ia, iaRes.ok);

          const now = new Date().toLocaleTimeString("es-AR");
          document.getElementById("refresh-hint").textContent = `última actualización: ${now}`;
        } catch {
          document.getElementById("refresh-hint").textContent = "error al consultar estado";
        }

        document.getElementById("uptime").textContent = `activo hace ${fmt(Date.now() - startTime)}`;
      }

      refreshStatus();
      setInterval(refreshStatus, 5000);
    </script>
  </body>
</html>
